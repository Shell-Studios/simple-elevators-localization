name: Check peer language files

on:
  pull_request:
    paths:
      - 'bp/texts/**'
      - 'rp/texts/**'
  workflow_dispatch:

jobs:
  check:
    name: Verify pack.description sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run peer language check
        run: node scripts/check-peer-langs.js